<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Global Sprouts Union</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f6faf3;--surface:#fff;--ink:#0d2b22;--muted:#58706a;--leaf:#1f7a4d;--leaf2:#dff3e4;--lime:#c6f34b;--sun:#ffb938;--line:#d9e6dc;--bad:#c0452f;--f:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#0b1812;--surface:#12261d;--ink:#e6f2e3;--muted:#93ac9a;--leaf:#52c277;--leaf2:#1b3a2a;--line:#27433341;--bad:#ef7a64}}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--f);padding-top:env(safe-area-inset-top,0)}
h1,h2,h3{font-family:var(--f);line-height:1.05;margin:0 0 .5em;letter-spacing:-.02em}
a{color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;padding:10px 18px;flex-wrap:wrap}
.logo{font-weight:800;font-size:19px;margin-right:auto;cursor:pointer}.logo span{color:var(--leaf)}
nav{display:flex;gap:6px;overflow-x:auto}
button{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 16px;border-radius:999px;cursor:pointer;white-space:nowrap}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
button.on,.primary{background:var(--leaf);color:#fff;border-color:var(--leaf)}
.danger{color:var(--bad);border-color:var(--bad)}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}.pn{padding-top:24px;padding-bottom:60px}
.hero{background:#0d2b22;color:#eaf7ee;padding:56px 0 44px}
.hero h1{font-size:clamp(40px,10vw,88px);font-weight:800;max-width:13ch}
.hero p{max-width:54ch;color:#a9c9b6;font-size:19px}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.btn{display:inline-block;padding:13px 24px;border-radius:999px;font-weight:700;text-decoration:none}
.btn.lime{background:var(--lime);color:#0d2b22}.btn.ghost{border:1.5px solid #5f8a74;color:#eaf7ee}
.forest{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:6px;margin-top:38px;max-width:720px}
.forest span{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:#16392e;font-size:17px}
.forest span.on{background:var(--lime)}
.fc{color:#a9c9b6;font-size:14px;margin-top:10px}
.band{background:var(--lime);color:#0d2b22}.band .stats{margin:0;padding:22px 0}
.band .stat{background:none;border:0;padding:0}.band .stat b{color:#0d2b22;font-size:40px}.band .stat small{color:#1d4a37}
.sec{padding:58px 0}.sec h2{font-size:clamp(28px,5vw,46px);font-weight:800}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;counter-reset:s;list-style:none;padding:0}
.steps li{counter-increment:s;border-top:3px solid var(--leaf);padding-top:12px}
.steps li::before{content:counter(s);font:800 30px var(--f);color:var(--leaf);display:block}
.steps b{display:block;font-size:18px}
.sf{background:#0d2b22;color:#eaf7ee}.sf .note{color:#a9c9b6}
footer{text-align:center;padding:26px;color:var(--muted);font-size:14px}footer a{cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:16px 0}
.stat,.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}.card{margin-bottom:12px}
.stat b{display:block;font:800 30px var(--f);color:var(--leaf)}.stat small,.note{color:var(--muted);font-size:14px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.pts{background:var(--sun);color:#3a2a00;font-weight:700;border-radius:999px;padding:2px 10px;font-size:14px}
.tag{font-size:13px;border-radius:999px;padding:2px 10px;background:var(--leaf2)}
.tag.pending{background:#fbe9b5;color:#5a4200}.tag.rejected{background:#f6d4cc;color:#7a2514}
.bar{height:10px;background:var(--leaf2);border-radius:99px;overflow:hidden;min-width:90px;flex:1}.bar i{display:block;height:100%;background:var(--leaf)}
input,select,textarea{font:inherit;width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin:4px 0 10px}
label{font-size:14px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:420px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
.media{max-width:100%;border-radius:10px;max-height:220px}
.plant{font-size:64px;text-align:center;line-height:1.1}
.opt{display:block;width:100%;text-align:left;margin:6px 0;border-radius:10px}
.opt.right{background:var(--leaf);color:#fff}.opt.wrong{border-color:var(--bad);color:var(--bad)}
.err{color:var(--bad);font-size:14px;min-height:1.2em}
.cert{position:fixed;inset:0;z-index:20;background:#fff;color:#0d2b22;display:grid;place-items:center;text-align:center;padding:20px;overflow:auto}.cb{border:6px double #1f7a4d;padding:40px 24px;max-width:640px;width:100%}.cert h1{font-size:34px}.cert h2{font-size:44px;color:#1f7a4d}@media print{.np,header,main,footer{display:none!important}}
</style>
</head>
<body>
<header><div class="logo" onclick="go(home)">🌱 Global <span>Sprouts</span> Union</div><nav id="nav"></nav><select id="lg" aria-label="Language" onchange="setLang(this.value)" style="width:auto;margin:0;padding:6px 10px"><option value="uz">O‘zbekcha</option><option value="en">English</option><option value="ru">Русский</option></select></header>
<main id="app"></main>
<script>
/* ===== SUPABASE: loyihangiz URL va anon kalitini shu yerga yozing (README/javobdagi qadamlar). Bo‘sh qolsa demo rejim ishlaydi. ===== */
const SB_URL="",SB_KEY="";
const CL=!!(SB_URL&&SB_KEY&&window.supabase);
const OWNER_HASH="da9b20fcecf7132e1ee028c5ffb7e86c8830d5c8843edb40071a3f4e6b1add8c";
const COUNTRIES=["O‘zbekiston","Qozog‘iston","Qirg‘iziston","Turkiya","Hindiston","Braziliya","Keniya","Germaniya","AQSh","Yaponiya","Boshqa"];
const DEF=[
 {id:1,t:"Daraxt ekish",d:"Bitta ko‘chat eking va suratga oling.",p:50},
 {id:2,t:"Plastiksiz hafta",d:"7 kun plastik o‘ramsiz yashang, video yuboring.",p:80},
 {id:3,t:"Mahalla tozalash",d:"Do‘stlar bilan hovli yoki parkni yig‘ishtiring.",p:60},
 {id:4,t:"Suv tejash",d:"Suvni tejash usulini ko‘rsating (30 soniya video).",p:30}
];
const QUIZ=[
 {q:"Plastik butilka tabiatda taxminan qancha vaqtda chirimaydi?",o:["1 yil","10 yil","400 yildan ko‘p"],a:2},
 {q:"Daraxtlar havodan qaysi gazni yutadi?",o:["Karbonat angidrid","Azot","Geliy"],a:0},
 {q:"Qaysi biri qayta tiklanadigan energiya?",o:["Ko‘mir","Quyosh","Neft"],a:1}
];
const TIPS=["Tishni yuvayotganda kranni yoping: kuniga ~10 litr suv tejaladi.","Eski kitobni tashlamang, do‘stingizga bering.","Bir kun ovqatni tugatib, hech narsani tashlamang."];
const SEED={users:[],subs:[],apps:[]};
let DB,S;
try{DB=JSON.parse(localStorage.getItem("gsu2")||"null")}catch(e){DB=null}
if(!DB)DB=JSON.parse(JSON.stringify(SEED));
if(!DB.tasks)DB.tasks=DEF.map(x=>({...x,on:true}));
try{S=JSON.parse(localStorage.getItem("gsu2_s")||"null")}catch(e){S=null}
const save=()=>{if(CL)return;try{localStorage.setItem("gsu2",JSON.stringify(DB));localStorage.setItem("gsu2_s",JSON.stringify(S))}catch(e){}};
if(CL){S=null;DB={users:[],subs:[],apps:[],tasks:[]}}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const task=id=>DB.tasks.find(t=>t.id==id)||{t:"(o‘chirilgan)",p:0,d:""};
const live=t=>t.on&&(!t.end||t.end>=new Date().toISOString().slice(0,10));
const user=id=>DB.users.find(u=>u.id==id)||{name:"?",country:"?",xp:0};
const parts=()=>DB.users.filter(u=>u.role=="participant");
const pts=uid=>user(uid).pts??DB.subs.filter(s=>s.uid==uid&&s.status=="approved").reduce((a,s)=>a+task(s.task).p,0)+(user(uid).xp||0);
const LV=[[0,"🌱","Urug‘"],[50,"🌿","Nihol"],[150,"🪴","Ko‘chat"],[300,"🌳","Daraxt"]];
const level=p=>LV.filter(l=>p>=l[0]).pop();
const ownerOk=()=>S&&S.role=="owner";

function statsHTML(){const ps=parts(),v=CL?[ST.p,ST.c,ST.n,ST.t,ST.a]:[ps.length,new Set(ps.map(u=>u.country)).size,DB.subs.filter(s=>s.status=="approved").length,ps.reduce((a,u)=>a+pts(u.id),0),DB.users.filter(u=>u.role=="ambassador").length];
 return `<div class="stats">${["ishtirokchi","davlat","bajarilgan vazifa","jami ball","elchi"].map((k,i)=>`<div class="stat"><b>${v[i]}</b><small>${k}</small></div>`).join("")}</div>`}
function bars(items){if(!items.length)return '<p class="note">Hali ma’lumot yo‘q.</p>';const m=Math.max(1,...items.map(i=>i[1]));return items.map(i=>`<div class="row" style="margin:6px 0"><span style="min-width:110px">${esc(i[0])}</span><div class="bar"><i style="width:${i[1]/m*100}%"></i></div><b>${i[1]}</b></div>`).join("")}
const byCountry=()=>{if(CL)return ST.by||[];const m={};parts().forEach(u=>m[u.country]=(m[u.country]||0)+1);return Object.entries(m).sort((a,b)=>b[1]-a[1])};
const opts=()=>COUNTRIES.map(c=>`<option>${c}</option>`).join("");

/* ---- Bosh sahifa: qo'shilish, elchi arizasi, kirish ---- */
function home(){const n=CL?ST.p:parts().length,live_=DB.tasks.filter(live);
 const forest=Array.from({length:60},(_,i)=>`<span class="${i<n?"on":""}">${i<n?"🌱":""}</span>`).join("");
 return `<section class="hero"><div class="wrap"><h1>Bir bola, bir ko‘chat. Butun dunyo bir o‘rmon.</h1>
<p>Global Sprouts Union: dunyo bolalari ekologik challenjlarni bajaradi, ball yig‘adi va tasdiqlangan elchilar ularni tekshiradi.</p>
<div class="cta"><a class="btn lime" href="#join">Qo‘shilish</a><a class="btn ghost" href="#amb">Elchi bo‘lish</a></div>
<div class="forest" role="img" aria-label="${n} ishtirokchi">${forest}</div>
<div class="fc">${n?`Har bir ko‘chat bitta ishtirokchi: hozir ${n} ta.`:"Hali birorta ko‘chat yo‘q. Birinchisi sizniki bo‘lsin."}</div></div></section>
<div class="band"><div class="wrap">${statsHTML()}</div></div>
<section class="sec"><div class="wrap"><h2>Qanday ishlaydi</h2><ol class="steps">
<li><b>Qo‘shiling</b><span class="note">Ism, davlat va ota-ona ruxsati. Darhol o‘z panelingizga kirasiz.</span></li>
<li><b>Challenj tanlang</b><span class="note">Daraxt eking, suv tejang, mahallani tozalang.</span></li>
<li><b>Surat yoki video yuboring</b><span class="note">Qilgan ishingizni ko‘rsating.</span></li>
<li><b>Elchi tekshiradi</b><span class="note">Tasdiqlansa ball olasiz va ko‘chatingiz o‘sadi.</span></li></ol></div></section>
<section class="sec" style="padding-top:0"><div class="wrap"><h2>Faol challenjlar</h2><div class="grid">
${live_.map(t=>`<div class="card"><div class="row"><h3 style="margin:0">${esc(t.t)}</h3><span class="pts">${t.p} ball</span></div><p class="note">${esc(t.d)}</p></div>`).join("")||'<p class="note">Yangi challenjlar tez orada.</p>'}</div></div></section>
<section class="sec" id="join" style="background:var(--leaf2)"><div class="wrap"><h2>Bugun boshlang</h2><div class="grid">
<div class="card"><h3>Ishtirokchi bo‘lish</h3><label for="jn">Ismingiz</label><input id="jn" maxlength="30">
<label for="jc">Davlat</label><select id="jc">${opts()}</select>
<label for="ja">Yoshingiz</label><input id="ja" type="number" min="5" max="17">
<label for="jg">Jins</label><select id="jg"><option value="n">Aytmayman</option><option value="f">Qiz</option><option value="m">O‘g‘il</option></select>
${CL?'<label for="jm">Ota-ona emaili</label><input id="jm" type="email"><label for="jw">Parol (8+ belgi)</label><input id="jw" type="password" autocomplete="new-password">':""}
<label><input id="jp" type="checkbox" style="width:auto;margin-right:6px">Ota-onam yoki vasiyim ruxsat bergan</label>
<div class="err" id="je"></div><button class="primary" onclick="join()">Boshlash</button></div>
<div class="card" id="amb"><h3>Elchi bo‘lish</h3><label for="an">Ism</label><input id="an">
<label for="ac">Davlat</label><select id="ac">${opts()}</select>

<label for="ag">Jins</label><select id="ag"><option value="n">Aytmayman</option><option value="f">Qiz</option><option value="m">O‘g‘il</option></select>
<label for="aw">Nega elchi bo‘lmoqchisiz?</label><textarea id="aw" rows="3"></textarea>
${CL?'<label for="am">Email</label><input id="am" type="email"><label for="ap">Parol (8+ belgi)</label><input id="ap" type="password" autocomplete="new-password">':""}
<label for="al">Havola (ixtiyoriy)</label><input id="al">
<div class="err" id="ae"></div><button onclick="applyAmb()">Ariza yuborish</button></div>
${CL?`<div class="card"><h3>Qaytib kirish</h3><label for="le">Email</label><input id="le" type="email"><label for="lp">Parol</label><input id="lp" type="password" autocomplete="current-password"><div class="err" id="lx"></div><button class="primary" onclick="login()">Kirish</button></div>`:DB.users.length?`<div class="card"><h3>Qaytib kirish</h3><label for="lu">Ismingiz</label>
<select id="lu">${DB.users.map(u=>`<option value="${u.id}">${esc(u.name)} (${esc(u.country)})${u.role=="ambassador"?" elchi":""}</option>`).join("")}</select>
<button class="primary" onclick="login()">Kirish</button></div>`:""}</div></div></section>
<section class="sec"><div class="wrap"><h2>Davlatlar bo‘yicha</h2><div class="card">${bars(byCountry())}</div></div></section>
<section class="sec sf"><div class="wrap"><h2>Bolalar xavfsizligi birinchi</h2><div class="grid">
<div><h3>Ota-ona ruxsati</h3><p class="note">Ro‘yxatdan o‘tish uchun majburiy.</p></div>
<div><h3>Har bir material tekshiriladi</h3><p class="note">Surat va videolar elchi ko‘zidan o‘tmaguncha ball berilmaydi.</p></div>
<div><h3>Minimal ma’lumot</h3><p class="note">Reytingda faqat ism va davlat ko‘rinadi.</p></div></div></div></section>
<footer>© Global Sprouts Union · <a onclick="go(ownerLogin)">Egasi kirishi</a></footer>`}
function join(){const n=$("#jn").value.trim(),a=+$("#ja").value;
 if(!n)return $("#je").textContent=tr("Ismingizni yozing.");
 if(!(a>=5&&a<=17))return $("#je").textContent=tr("Yosh 5 dan 17 gacha bo‘lishi kerak.");
 if(!$("#jp").checked)return $("#je").textContent=tr("Ota-ona yoki vasiy ruxsati kerak.");
 const u={id:"u"+Date.now(),name:n,country:$("#jc").value,role:"participant",xp:0,age:a,g:$("#jg").value};
 DB.users.push(u);S={role:"participant",uid:u.id};save();go(participant)}
function applyAmb(){const n=$("#an").value.trim(),w=$("#aw").value.trim();
 if(!n||w.length<20)return $("#ae").textContent=tr("Ism va kamida 20 belgilik izoh yozing.");
 DB.apps.push({id:"p"+Date.now(),name:n,country:$("#ac").value,why:w,g:$("#ag").value,link:$("#al").value,status:"pending"});save();
 $("#ae").style.color="var(--leaf)";$("#ae").textContent=tr("Ariza yuborildi. Egasi ko‘rib chiqadi.")}
function login(){const u=user($("#lu").value);S={role:u.role,uid:u.id};save();go(u.role=="ambassador"?ambassador:participant)}
function logout(){S=null;save();go(home)}

/* ---- Ishtirokchi paneli ---- */
let qi=0,qdone=null;
function participant(){const u=user(S.uid),p=pts(u.id),l=level(p),nx=LV.find(x=>x[0]>p);
 const mine=DB.subs.filter(s=>s.uid==u.id).reverse();
 const today=new Date().toDateString(),qd=u.qday==today;
 return `<h2>Salom, ${esc(u.name)}!</h2>
<div class="card"><div class="plant" aria-hidden="true">${l[1]}</div><div class="row"><b>${l[2]} · ${p} ball</b><span class="note">${esc(u.country)}</span>${p>=50?'<button onclick="cert()">Sertifikat</button>':""}</div>
<div class="bar" style="margin-top:8px"><i style="width:${nx?(p-l[0])/(nx[0]-l[0])*100:100}%"></i></div>
<div class="note">${nx?`Keyingi daraja: ${nx[2]} (${nx[0]-p} ball qoldi)`:"Eng yuqori daraja!"}</div></div>
<div class="grid">
<div class="card"><h3>Kunlik eko-viktorina</h3>${qd?'<p class="note">Bugungi viktorina bajarildi. Ertaga qaytib keling!</p>':quizHTML()}</div>
<div class="card"><h3>Bugungi maslahat</h3><p>${TIPS[new Date().getDate()%TIPS.length]}</p></div></div>
<h3>Faol challenjlar</h3>
${DB.tasks.filter(live).map(t=>`<div class="card"><div class="row"><b>${esc(t.t)}</b><span class="pts">${t.p} ball</span></div><p class="note">${esc(t.d)}${t.end?` · muddat: ${t.end}`:""}</p></div>`).join("")||'<p class="note">Hozircha faol challenj yo‘q.</p>'}
<h3>Vazifa yuborish</h3>
<div class="card"><label for="t">Vazifa</label><select id="t">${DB.tasks.filter(live).map(t=>`<option value="${t.id}">${esc(t.t)} (+${t.p})</option>`).join("")}</select>
<label for="f">Surat yoki video</label><input id="f" type="file" accept="image/*,video/*">
<label for="n">Izoh</label><textarea id="n" rows="2"></textarea>
<button class="primary" onclick="submitTask()">Yuborish</button> <span class="note">Elchi tekshirgach ball qo‘shiladi.</span></div>
<h3>Yuborganlarim</h3>
${mine.length?mine.map(s=>`<div class="card row"><div><b>${task(s.task).t}</b><div class="note">${esc(s.note)}</div></div><span class="tag ${s.status}">${{approved:"Tasdiqlandi",pending:"Kutilmoqda",rejected:"Rad etildi"}[s.status]}</span></div>`).join(""):'<p class="note">Hali vazifa yo‘q. Birinchisini yuboring.</p>'}
<h3>Dunyo reytingi</h3><div class="card">${bars(parts().map(x=>[x.name,pts(x.id)]).sort((a,b)=>b[1]-a[1]).slice(0,8))}</div>`}
function quizHTML(){const q=QUIZ[qi];return `<p><b>${q.q}</b></p>${q.o.map((o,i)=>`<button class="opt" onclick="answer(${i},this)">${o}</button>`).join("")}<div class="note" id="qm">Savol ${qi+1}/${QUIZ.length} · to‘g‘ri javob +10 ball</div>`}
function answer(i,b){const q=QUIZ[qi],ok=i==q.a;b.classList.add(ok?"right":"wrong");
 document.querySelectorAll(".opt").forEach(x=>x.disabled=true);
 const u=user(S.uid);if(ok)u.xp=(u.xp||0)+10;
 setTimeout(()=>{if(qi<QUIZ.length-1){qi++}else{qi=0;u.qday=new Date().toDateString()}save();render()},900)}
function submitTask(){if(!$("#t").value)return;const f=$("#f").files[0];
 const add=file=>{DB.subs.push({id:"s"+Date.now(),uid:S.uid,task:+$("#t").value,note:$("#n").value,file,status:"pending",by:""});save();render()};
 if(f&&f.size<1.5e6){const r=new FileReader();r.onload=()=>add(r.result);r.readAsDataURL(f)}else add("")}

/* ---- Elchi paneli ---- */
function review(id,st){const s=DB.subs.find(x=>x.id==id);s.status=st;s.by=S.uid;save();render()}
function ambassador(){const q=DB.subs.filter(s=>s.status=="pending");
 return `<h2>Elchi paneli</h2><div class="stats"><div class="stat"><b>${q.length}</b><small>kutmoqda</small></div><div class="stat"><b>${DB.subs.filter(s=>s.by==S.uid).length}</b><small>siz tekshirgan</small></div></div>
${q.length?q.map(s=>{const u=user(s.uid);return `<div class="card"><div class="row"><b>${esc(u.name)} · ${esc(u.country)}</b><span class="pts">${task(s.task).p} ball</span></div><div>${task(s.task).t}</div><p class="note">${esc(s.note)}</p>
${s.file?((s.vid||s.file.startsWith("data:video"))?`<video class="media" controls src="${s.file}"></video>`:`<img class="media" alt="Yuborilgan surat" src="${s.file}">`):'<p class="note">(Demo: fayl yo‘q)</p>'}
<div class="row" style="justify-content:flex-start"><button class="primary" onclick="review('${s.id}','approved')">Tasdiqlash</button><button class="danger" onclick="review('${s.id}','rejected')">Rad etish</button></div></div>`}).join(""):'<p class="note">Hammasi tekshirilgan.</p>'}`}

/* ---- Egasi: parol bilan kirish ---- */

applyAmb=async()=>{const n=$("#an").value.trim(),w=$("#aw").value.trim(),em=$("#am").value.trim(),pw=$("#ap").value;$("#ae").style.color="";
 if(!n||w.length<20)return E("#ae","Ism va kamida 20 belgilik izoh yozing.");if(!em||pw.length<8)return E("#ae","Email va 8+ belgili parol kerak.");
 const r=await sb.from("applications").insert({name:n,country:$("#ac").value,gender:$("#ag").value,why:w,link:$("#al").value,email:em});
 if(r.error)return $("#ae").textContent=r.error.message;
 await sb.auth.signUp({email:em,password:pw,options:meta(n,$("#ac").value,null,$("#ag").value)});
 $("#ae").style.color="var(--leaf)";E("#ae","Ariza yuborildi. Egasi ko‘rib chiqadi.")};
const sign=async(em,pw,er)=>{const r=await sb.auth.signInWithPassword({email:em,password:pw});if(r.error){E(er,"Email yoki parol noto‘g‘ri.");return false}await pull();return true};
login=async()=>{if(await sign($("#le").value.trim(),$("#lp").value,"#lx"))go(S&&S.role=="ambassador"?ambassador:S&&S.role=="owner"?admin:participant)};
ownerGo=async()=>{if(!(await sign($("#oe").value.trim(),$("#pw").value,"#pe")))return;if(S&&S.role=="owner")go(admin);else{await sb.auth.signOut();await pull();E("#pe","Email yoki parol noto‘g‘ri.")}};
logout=async()=>{await sb.auth.signOut();await pull();go(home)};
submitTask=async()=>{const t=$("#t").value;if(!t)return;const f=$("#f").files[0];let path=null;
 if(f){if(f.size>20971520)return alert("Fayl 20 MB dan oshmasin");path=`${S.uid}/${Date.now()}-${f.name.replace(/[^\w.]/g,"_")}`;
  const u=await sb.storage.from("media").upload(path,f);if(u.error)return alert(u.error.message)}
 const r=await sb.from("submissions").insert({task_id:t,note:$("#n").value,file_path:path,is_video:!!f&&f.type.startsWith("video")});
 if(r.error)return alert(r.error.message);await pull();render()};
review=async(id,st)=>{await sb.rpc("review_submission",{sid:id,new_status:st});await pull();render()};
decide=async(id,st)=>{await sb.rpc("decide_application",{aid:id,new_status:st});await pull();render()};
answer=(i,b)=>{const q=QUIZ[qi],ok=i==q.a;b.classList.add(ok?"right":"wrong");document.querySelectorAll(".opt").forEach(x=>x.disabled=true);if(ok)qs++;
 setTimeout(async()=>{if(qi<QUIZ.length-1)qi++;else{await sb.rpc("finish_quiz",{score:qs});qi=0;qs=0;await pull()}render()},900)};
addChallenge=async()=>{const t=$("#ct").value.trim(),d=$("#cd").value.trim(),p=+$("#cp").value;
 if(t.length<3||d.length<10)return $("#ch").textContent="Nom (3+) va tavsif (10+ belgi) yozing.";if(!(p>=5&&p<=500))return $("#ch").textContent="Ball 5 dan 500 gacha bo‘lsin.";
 const r=await sb.from("tasks").insert({title:t,descr:d,points:p,ends_on:$("#ce").value||null});if(r.error)return $("#ch").textContent=r.error.message;await pull();render()};
toggleChallenge=async id=>{await sb.from("tasks").update({active:!DB.tasks.find(x=>x.id==id).on}).eq("id",id);await pull();render()};
delChallenge=async id=>{if(confirm("Challenj o‘chirilsinmi?")){await sb.from("tasks").delete().eq("id",id);await pull();render()}};
}
if(ownerOk()&&cur==home)cur=admin;
if(S&&S.role=="participant")cur=participant;else if(S&&S.role=="ambassador")cur=ambassador;else if(ownerOk())cur=admin;
render();
if(CL)pull().then(()=>{cur=S?(S.role=="participant"?participant:S.role=="ambassador"?ambassador:admin):home;render()});
</script>
