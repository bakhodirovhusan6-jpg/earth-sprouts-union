<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earth Sprouts Union (ESU)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b132b; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        header { width: 100%; max-width: 600px; display: flex; justify-content: space-between; align-items: center; padding: 15px 0; margin-bottom: 20px; }
        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-icon { width: 40px; height: 40px; background: linear-gradient(135deg, #00b09b, #96c93d); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .logo-text h1 { font-size: 18px; color: #fff; font-weight: 700; }
        .logo-text span { font-size: 10px; color: #96c93d; letter-spacing: 1px; }
        .menu-btn { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }
        
        .section { text-align: center; max-width: 600px; width: 100%; margin-top: 10px; display: none; }
        .section.active { display: block; }

        .badge { display: inline-block; background: rgba(150, 201, 61, 0.15); color: #96c93d; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; margin-bottom: 20px; border: 1px solid rgba(150, 201, 61, 0.3); }
        h2 { font-size: 26px; line-height: 1.3; margin-bottom: 15px; color: #fff; }
        h2 span { color: #96c93d; }
        p { font-size: 14px; color: #a0aec0; line-height: 1.6; margin-bottom: 25px; }

        .btn-group { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 400px; margin: 0 auto; }
        .btn { width: 100%; padding: 14px; border-radius: 30px; font-size: 15px; font-weight: 600; cursor: pointer; border: none; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
        .btn-primary { background: linear-gradient(135deg, #00b09b, #96c93d); color: #0b132b; }
        .btn-secondary { background: rgba(255, 255, 255, 0.05); color: #fff; border: 1px solid rgba(255, 255, 255, 0.1); }
        .btn-danger { background: #e63946; color: #fff; margin-top: 10px; }
        .btn:active { transform: scale(0.97); }

        .form-card { background: #1c2541; padding: 20px; border-radius: 16px; text-align: left; border: 1px solid rgba(255,255,255,0.1); margin-top: 10px; }
        .form-card input, .form-card textarea { width: 100%; padding: 12px; margin-bottom: 15px; background: #0b132b; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: #fff; }
        .form-card label { font-size: 13px; color: #96c93d; display: block; margin-bottom: 5px; }

        /* Admin Panel Styles */
        .admin-panel { text-align: left; background: #1c2541; padding: 20px; border-radius: 16px; border: 1px solid rgba(150, 201, 61, 0.3); }
